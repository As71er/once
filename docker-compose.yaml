services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: once-api
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - dbdata:/api/data
      - oncearchive:/api/archive
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dbdata:
  oncearchive:
